<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1127 刘馨月</title>
    <style>
        :root {
            --bg1: #ffe6f0;
            --bg2: #dfe9ff;
            --card: rgba(255, 255, 255, 0.75);
            --primary: #ff5ca8;
            --secondary: #6c8cff;
            --text: #3e3a4d;
            --shadow: rgba(143, 122, 196, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.45;
            z-index: 0;
        }

        body::before {
            background: rgba(255, 92, 168, 0.24);
            top: -80px;
            left: -50px;
        }

        body::after {
            background: rgba(108, 140, 255, 0.18);
            right: -40px;
            bottom: -80px;
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(540px, 82vw);
            padding: 42px 38px;
            border-radius: 28px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 22px 60px var(--shadow);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            margin-bottom: 16px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 10px 22px rgba(108, 140, 255, 0.3);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 6vw, 4rem);
            line-height: 1.2;
            letter-spacing: 4px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 8px 24px rgba(255, 92, 168, 0.15);
        }

        .subtitle {
            margin-top: 18px;
            font-size: 1rem;
            color: rgba(62, 58, 77, 0.8);
            letter-spacing: 0.08em;
        }

        .sparkle {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin: 0 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd1eb, #ff8cc6);
            box-shadow: 0 0 18px rgba(255, 92, 168, 0.8);
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">HELLO</div>
        <h1>1127 刘馨月</h1>
        <div class="subtitle"><span class="sparkle"></span> 你好，愿你今天也很精彩 <span class="sparkle"></span></div>
    </div>
</body>
</html>
