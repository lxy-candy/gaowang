<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1127-刘馨月</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            padding: 40px;
        }
        h1{
            text-align: center;
            margin-bottom: 40px;
        }
        .flex{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }
        .box{
            width: 220px;
            height: 220px;
            border: 1px solid #333;
            padding: 15px;
            background-color: #fff;
        }
        .box1{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1 .item{
            width: 60px;
            height: 60px;
            border: 1px solid #333;
            background-color: #c8eeff;
        }

        .box2{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .box2 .item{
            width: 100px;
            height: 45px;
            border: 1px solid #333;
            background-color: #c5b9f0;
        }

        .box3{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
        }
        .box3 .item{
            width: 48%;
            height: 45%;
            border: 1px solid #333;
            background-color: #ffe8b1;
        }

        .box4{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
        }
        .box4 .item-top{
            width: 100%;
            height: 30%;
            border: 1px solid #333;
            background-color: #ffdcf9;
        }
        .box4 .item-bottom{
            width: 48%;
            height: 45%;
            border: 1px solid #333;
            background-color: #ffdcf9;
        }
    </style>
</head>
<body>
    <h1>Flex 布局演示</h1>
    <div class="flex">
        <div class="box box1">
            <div class="item"></div>
        </div>
        <div class="box box2">
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="box box3">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="box box4">
            <div class="item-top"></div>
            <div class="item-bottom"></div>
            <div class="item-bottom"></div>
        </div>
    </div>
</body>
</html>
