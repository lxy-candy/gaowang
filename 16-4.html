            // ========== 滑动指示器定位 ==========
            function Lxy_moveIndicator(tab) {
                var ind = document.getElementById('Lxy_indicator');
                var wrap = document.getElementById('Lxy_tabs-wrap');
                var tabs = document.querySelectorAll('.Lxy_tab');
                // 计算 offset 相对于 tabs-wrap
                var parentRect = wrap.getBoundingClientRect();
                var tabRect = tab.getBoundingClientRect();
                ind.style.width = tabRect.width + 'px';
                ind.style.left = (tabRect.left - parentRect.left) + 'px';
            }

            // ========== 渲染 ==========
            var currentTab = "home";

            function Lxy_render(tabKey) {
                currentTab = tabKey;
                var data = DATA[tabKey];

                // Tab 高亮 + 滑动指示器
                var tabs = document.querySelectorAll('.Lxy_tab');
                var activeTab = null;
                tabs.forEach(function (t) {
                    var isActive = t.dataset.tab === tabKey;
                    t.classList.toggle('Lxy_tab--active', isActive);
                    if (isActive) activeTab = t;
                });
                // 下一帧移动，确保宽度正确
                requestAnimationFrame(function () {
                    if (activeTab) Lxy_moveIndicator(activeTab);
                });

                // Hero
                var hero = document.getElementById('Lxy_hero');
                hero.classList.remove('Lxy_fade-in'); void hero.offsetWidth; hero.classList.add('Lxy_fade-in');
                document.getElementById('Lxy_heroTag').textContent = data.heroTag;
                document.getElementById('Lxy_heroTitle').textContent = data.hero;
                document.getElementById('Lxy_heroMeta').textContent = data.meta;

                // 文章列表（带缩略图）
                var list = document.getElementById('Lxy_list');
                list.innerHTML = '';
                data.articles.forEach(function (item, idx) {
                    var row = document.createElement('a');
                    row.className = 'Lxy_item Lxy_fade-in';
                    row.href = 'index.html';
                    row.target = '_blank';
                    row.style.animationDelay = (idx * 50) + 'ms';
                    row.innerHTML =
                        '<div class="Lxy_thumb">' +
                            '<img src="' + item.thumb + '" alt="" loading="lazy" onerror="this.src=\\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%2280%22><rect width=%22120%22 height=%2280%22 fill=%22%231a3a7a%22/><text x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2214%22 font-family=%22sans-serif%22>' + item.tag + '</text></svg>\\'">' +
                            '<span class="Lxy_thumb-tag">' + item.tag + '</span>' +
                        '</div>' +
                        '<div class="Lxy_item-body">' +
                            '<div class="Lxy_top-row">' +
                                '<span class="Lxy_tag">' + item.tag + '</span>' +
                                '<span class="Lxy_item-source">' + item.source + '</span>' +
                            '</div>' +
                            '<div class="Lxy_item-title">' + item.title + '</div>' +
                            '<div class="Lxy_item-desc">' + item.desc + '</div>' +
                            '<div class="Lxy_bottom-row">' +
                                '<span><i class="iconfont icon-time"></i>' + item.source + ' · 阅读需3分钟</span>' +
                                '<span class="Lxy_date">' + item.date + '</span>' +
                            '</div>' +
                        '</div>';
                    list.appendChild(row);
                });
            }

            // Tab 点击
            document.querySelectorAll('.Lxy_tab').forEach(function (t) {
                t.addEventListener('click', function () {
                    if (t.dataset.tab !== currentTab) Lxy_render(t.dataset.tab);
                });
            });

            // 窗口尺寸变化时指示器重定位
            window.addEventListener('resize', function () {
                var active = document.querySelector('.Lxy_tab--active');
                if (active) Lxy_moveIndicator(active);
            });

            // 初始
            Lxy_render('home');
        })();
    </script>
</body>
</html>
