    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f5f6f8; min-height: 100vh; padding: 30px 20px;
            color: #333;
        }

        .Lxy_wrap { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 20px rgba(0,0,0,0.06); overflow: hidden; }

        /* ====== 顶部 Brand ====== */
        .Lxy_header {
            padding: 22px 28px 0; border-bottom: 1px solid #eee;
        }
        .Lxy_brand {
            font-size: 22px; font-weight: 800; color: #1a3a7a;
            letter-spacing: 2px; display: flex; align-items: center; gap: 12px;
        }
        .Lxy_brand .Lxy_logo-dot {
            width: 8px; height: 26px; background: linear-gradient(180deg, #1a3a7a, #4a7dd6); border-radius: 4px;
        }
        .Lxy_header-sub { font-size: 12px; color: #999; margin-top: 4px; letter-spacing: 2px; }
        .Lxy_author-tag {
            float: right; margin-top: -28px;
            padding: 3px 12px; background: #1a3a7a; color: #fff;
            font-size: 12px; border-radius: 12px; font-weight: 600; letter-spacing: 1px;
        }

        /* ====== Tab 栏 ====== */
        .Lxy_tabs {
            display: flex; border-bottom: 2px solid #e8e8e8; padding: 0 28px;
            background: #fafbfc;
        }
        .Lxy_tab {
            padding: 14px 22px; cursor: pointer; font-size: 15px; color: #666;
            border-bottom: 3px solid transparent; margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s; font-weight: 500;
        }
        .Lxy_tab:hover { color: #1a3a7a; }
        .Lxy_tab--active {
            color: #1a3a7a; border-bottom-color: #1a3a7a; font-weight: 700;
        }

        /* ====== 大标题区 ====== */
        .Lxy_hero {
            padding: 26px 28px 20px;
            background: linear-gradient(135deg, #f9fbff 0%, #ffffff 100%);
            border-bottom: 1px solid #eee;
        }
        .Lxy_hero-title {
            font-size: 26px; font-weight: 800; color: #1a2b4a;
            line-height: 1.4; letter-spacing: 1px;
        }
        .Lxy_hero-meta {
            margin-top: 10px; font-size: 12px; color: #999;
        }

        /* ====== 文章列表 ====== */
        .Lxy_list { padding: 0 28px 10px; }
        .Lxy_item {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 0; border-bottom: 1px dashed #eee;
            cursor: pointer; transition: background 0.15s, padding-left 0.15s;
            text-decoration: none; color: inherit;
        }
        .Lxy_item:hover {
            background: #f5f8ff; padding-left: 10px;
        }
        .Lxy_item:hover .Lxy_item-title { color: #1a3a7a; }

        .Lxy_tag {
            flex-shrink: 0; padding: 3px 10px; font-size: 11px; font-weight: 600;
            background: #eef2fa; color: #1a3a7a; border-radius: 3px; letter-spacing: 1px;
        }

        .Lxy_item-title {
            flex: 1; font-size: 15px; color: #333; font-weight: 500;
            transition: color 0.15s;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .Lxy_item-date {
            flex-shrink: 0; font-size: 13px; color: #bbb; font-family: "Consolas", monospace;
        }

        /* 底部分隔 + 返回首页 */
        .Lxy_list-end {
            text-align: center; padding: 24px 0; color: #bbb; font-size: 12px;
        }
        .Lxy_back {
            display: inline-block; padding: 8px 24px; margin-top: 14px;
            background: #1a3a7a; color: #fff !important; border-radius: 20px;
            text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 2px;
            transition: transform 0.2s;
        }
        .Lxy_back:hover { transform: scale(1.05); }

        /* ====== 底部 ====== */
        .Lxy_footer {
            text-align: center; padding: 18px; color: #aaa; font-size: 11px;
            border-top: 1px solid #eee; letter-spacing: 2px;
        }

        /* ====== 加载动画 ====== */
        .Lxy_fade-in { animation: Lxy-fade 0.3s ease-out; }
        @keyframes Lxy-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

            // ========== 渲染 ==========

            function Lxy_render(tabKey) {
                currentTab = tabKey;
                var data = DATA[tabKey];

                // Tab 高亮
                document.querySelectorAll('.Lxy_tab').forEach(function (t) {
                    t.classList.toggle('Lxy_tab--active', t.dataset.tab === tabKey);
                });

                // Hero 区（带 fade 动画）
                var hero = document.getElementById('Lxy_hero');
                hero.classList.remove('Lxy_fade-in'); void hero.offsetWidth; hero.classList.add('Lxy_fade-in');
                document.getElementById('Lxy_heroTitle').textContent = data.hero;
                document.getElementById('Lxy_heroMeta').textContent = data.meta;

                // 文章列表（带 fade 动画）
                var list = document.getElementById('Lxy_list');
                list.innerHTML = '';
                data.articles.forEach(function (item, idx) {
                    var row = document.createElement('a');
                    row.className = 'Lxy_item Lxy_fade-in';
                    row.href = 'index.html';  // 跳转到首页
                    row.target = '_blank';
                    row.style.animationDelay = (idx * 40) + 'ms';
                    row.innerHTML =
                        '<span class="Lxy_tag">' + item.tag + '</span>' +
                        '<span class="Lxy_item-title">' + item.title + '</span>' +
                        '<span class="Lxy_item-date">' + item.date + '</span>';
                    list.appendChild(row);
                });
            }

            // Tab 点击
            document.querySelectorAll('.Lxy_tab').forEach(function (t) {
                t.addEventListener('click', function () {
                    if (t.dataset.tab !== currentTab) Lxy_render(t.dataset.tab);
                });
            });

            // 初始
            Lxy_render('home');
