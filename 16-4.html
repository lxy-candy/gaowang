<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    姓名：刘馨月
    日期：2026-10-29
    功能：汽车导购多 Tab 筛选页面（严格还原参考图格式和内容）
    -->
    <title>汽车导购 · 多 Tab 筛选 · 刘馨月</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f4f4; min-height: 100vh; padding: 40px 20px; color: #333;
        }

        .Lxy_wrap {
            max-width: 800px; margin: 0 auto; background: #fff;
            border: 1px solid #e0e0e0; border-radius: 3px;
        }

        /* ====== Tab 栏 ====== */
        .Lxy_tabs {
            display: flex; border-bottom: 2px solid #e5e5e5;
            background: #fff;
        }
        .Lxy_tab {
            flex: 1; text-align: center; padding: 14px 0;
            font-size: 15px; color: #999; font-weight: 400;
            cursor: pointer; border-bottom: 2px solid transparent;
            margin-bottom: -2px; transition: color 0.2s, border-color 0.2s;
        }
        .Lxy_tab:hover { color: #333; }
        .Lxy_tab--active {
            color: #333; font-weight: 700; border-bottom-color: #333;
        }

        /* ====== 内容区 ====== */
        .Lxy_content { padding: 28px 32px 10px; }

        /* 左侧小标签 */
        .Lxy_tag {
            display: inline-block; padding: 2px 8px; font-size: 12px;
            color: #666; border: 1px solid #ccc; border-radius: 2px;
            margin-bottom: 14px;
        }

        /* 大标题 */
        .Lxy_title {
            font-size: 20px; font-weight: 700; color: #222;
            line-height: 1.5; margin-bottom: 22px;
        }

        /* ====== 文章列表 ====== */
        .Lxy_item {
            display: flex; justify-content: space-between;
            padding: 13px 0; border-bottom: 1px dashed #e8e8e8;
            cursor: pointer; text-decoration: none; color: inherit;
            transition: color 0.15s;
        }
        .Lxy_item:hover .Lxy_title-text { color: #2a5db0; }

        .Lxy_title-text {
            font-size: 14.5px; color: #333; flex: 1;
            padding-right: 20px; transition: color 0.15s;
        }
        .Lxy_date {
            font-size: 13px; color: #bbb; flex-shrink: 0;
            font-family: "Consolas", "Courier New", monospace;
        }

        /* ====== 底部 ====== */
        .Lxy_footer {
            text-align: center; padding: 14px; font-size: 11px;
            color: #bbb; border-top: 1px solid #eee; letter-spacing: 2px;
        }

        /* 切换动画 */
        .Lxy_fade { animation: Lxy-fade 0.25s ease-out; }
        @keyframes Lxy-fade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="Lxy_wrap">

        <!-- Tab 栏 -->
        <div class="Lxy_tabs" id="Lxy_tabs">
            <div class="Lxy_tab Lxy_tab--active" data-tab="daogou">导购</div>
            <div class="Lxy_tab" data-tab="t3-9">3-9万</div>
            <div class="Lxy_tab" data-tab="t9-17">9-17万</div>
            <div class="Lxy_tab" data-tab="t17-42">17-42万</div>
            <div class="Lxy_tab" data-tab="suv">SUV</div>
        </div>

        <!-- 内容 -->
        <div class="Lxy_content" id="Lxy_content"></div>

        <div class="Lxy_footer">AUTO GUIDE · BY 刘馨月 · 2026</div>
    </div>

    <script>
        (function () {
            // ========== 数据（严格按 5 张参考图文字提取）==========
            var DATA = {
                // 图 1：导购
                daogou: {

                    ]
                },
                // 图 5：3-9万
                "t3-9": {
                    tag: "3-9万",
                    title: "B级品质满足A级需求 路盛E70亮点详解析",
                    items: [
                        { title: "购车必看 凯迪拉克XTS领先型28T深度体验",     date: "12/20" },
                        { title: "爸爸去哪？亲子出游适合车型和注意事项",       date: "12/20" },
                        { title: "推荐：X1等城市四驱Style+经济省油的SUV",     date: "12/19" },
                        { title: "全景天窗/保养便利 30万齐四驱SUV推荐",       date: "12/19" },
                        { title: "全民摇号时代？六款低价占号必备车型推荐",     date: "12/19" },
                        { title: "最高降幅20万！奥迪Q5等年底特惠SUV盘点",     date: "12/18" }
                    ]
                },
                // 图 2：9-17万
                "t9-17": {
                    tag: "9-17万",
                    title: "改变品牌的未来 认识豪华品牌最便宜车型",
                    items: [
                        { title: "爸爸去哪？亲子出游适合车型和注意事项",       date: "12/20" },
                        { title: "推荐：X1等城市四驱Style+经济省油的SUV",     date: "12/19" },
                        { title: "全景天窗/保养便利 30万齐四驱SUV推荐",       date: "12/19" },
                        { title: "最高降幅20万！奥迪Q5等年底特惠SUV盘点",     date: "12/18" },
                        { title: "比拼硬实力 8款低配四驱紧凑型SUV性能点评",   date: "12/17" },
                        { title: "新迪欧/帕萨特等！盘点2013中级大更车",       date: "12/17" }
                    ]
                },
                // 图 3：17-42万
                "t17-42": {
                    tag: "17-42万",
                    title: "15万级降价谁更值 预算/油耗/空间较量",
                    items: [
                        { title: "爸爸去哪？亲子出游适合车型和注意事项",       date: "12/20" },
                        { title: "最高降幅20万！奥迪Q5等年底特惠SUV盘点",     date: "12/18" },
                        { title: "颜值气质得肯定！传祺GA3S碰撞试验图解",       date: "12/16" },

                // 图 4：SUV
                suv: {
                    tag: "SUV",

                    items: [

                        { title: "土家气质 细数车展那些低价车上的\"神器\"",   date: "11/27" }
                    ]
                }
            };

            // ========== 渲染 ==========
            var current = "daogou";

            function Lxy_render(key) {
                current = key;
                var d = DATA[key];

                // Tab 高亮
                document.querySelectorAll('.Lxy_tab').forEach(function (t) {
                    t.classList.toggle('Lxy_tab--active', t.dataset.tab === key);
                });

                // 内容（带淡入动画）
                var box = document.getElementById('Lxy_content');
                box.classList.remove('Lxy_fade'); void box.offsetWidth; box.classList.add('Lxy_fade');

                var html = '<span class="Lxy_tag">' + d.tag + '</span>' +
                           '<h2 class="Lxy_title">' + d.title + '</h2>' +
                           '<div class="Lxy_list">';
                d.items.forEach(function (it) {
                    html += '<a class="Lxy_item" href="index.html" target="_blank">' +
                            '<span class="Lxy_title-text">' + it.title + '</span>' +
                            '<span class="Lxy_date">' + it.date + '</span>' +
                            '</a>';
                });
                html += '</div>';
                box.innerHTML = html;
            }

            // Tab 点击
            document.querySelectorAll('.Lxy_tab').forEach(function (t) {
                t.addEventListener('click', function () {
                    if (t.dataset.tab !== current) Lxy_render(t.dataset.tab);
                });
            });

            Lxy_render('daogou');
        })();
    </script>
</body>
</html>
