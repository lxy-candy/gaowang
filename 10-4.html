<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=320">
    <title>响应式八盒布局</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background: #f4f1eb;
            color: #222;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: clamp(1.6rem, 5vw, 2.5rem);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 12px;
        }

        .box {
            min-height: 150px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #b2aff5;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(30, 25, 80, 0.12);
            transition: transform 0.25s ease, background-color 0.25s ease;
        }

        .box:hover {
            transform: translateY(-5px);
            background: #554be8;
        }

        .box:nth-child(2n) { background: #84a7ff; }
        .box:nth-child(2n):hover { background: #ffb4f4; }
        .box:nth-child(3n) { background: #fd9eff; color: #3a2110; }
        .box:nth-child(3n):hover { background: #ffe0b9; }

        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 16px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>刘馨月 · 响应式八盒布局</h1>
        <section class="grid" aria-label="八个响应式盒子">
            <div class="box">盒子 1</div>
            <div class="box">盒子 2</div>
            <div class="box">盒子 3</div>
            <div class="box">盒子 4</div>
            <div class="box">盒子 5</div>
            <div class="box">盒子 6</div>
            <div class="box">盒子 7</div>
            <div class="box">盒子 8</div>
        </section>
    </main>
</body>
</html>
