<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #171717;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .slideshow {
            width: min(92vw, 900px);
            text-align: center;
        }

        .slideshow h1 {
            margin: 0 0 20px;
            font-size: clamp(1.8rem, 5vw, 3rem);
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 18px;
            background: #000;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
        }

        .image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: translateX(100%);
            animation: show-image 9s ease-in-out infinite;
        }

        .image:nth-child(2) {
            animation-delay: 3s;
        }

        .image:nth-child(3) {
            animation-delay: 6s;
        }

        .stage::after {
            content: "刘馨月";
            position: absolute;
            z-index: 2;
            left: 24px;
            bottom: 22px;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.62);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            pointer-events: none;
        }

        @keyframes show-image {
            0%, 8% {
                opacity: 0;
                transform: translateX(100%);
            }
            22%, 72% {
                opacity: 1;
                transform: translateX(0);
            }
            86%, 100% {
                opacity: 0;
                transform: translateX(-100%);
            }
        }

        @media (max-width: 520px) {
            .stage::after {
                left: 14px;
                bottom: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="slideshow">
        <h1>CSS 幻灯片</h1>
        <div class="stage" aria-label="幻灯片图片展示">
            <img class="image" src="img/croissant.png" alt="幻灯片图片一">
            <img class="image" src="img/matcha-mille.png" alt="幻灯片图片二">
            <img class="image" src="img/european-bread.png" alt="幻灯片图片三">
        </div>
    </main>
</body>
</html>
