<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model</title>
    <style>
        .a{
            width: 500px;
            height: 500px;
            padding: 70px 60px 50px 40px;/* 上 右 下 左 */
            border: 2px dotted #039;
            margin: 40px auto;
        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed #039;
            margin: 50px auto 40px;
        }
        .c{
            width: 500px;
            height: 300px;
            border: 2px solid #039;
            margin: 50px auto 40px;
        }
        </style>
</head>
<body>
    <div class="a">1127刘馨月</div>
    <div class="b">1127刘馨月</div>
    <div class="c">1127刘馨月</div>
</body>
</html>
